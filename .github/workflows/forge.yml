name: Check and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Forge environment to deploy
        type: choice
        options: [development, production]
        default: development

permissions:
  contents: write

concurrency:
  group: forge-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_SITE: ${{ vars.FORGE_SITE }}
      FORGE_ENV: ${{ inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Forge credentials
        id: creds
        run: |
          if [ -z "$FORGE_EMAIL" ] || [ -z "$FORGE_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the FORGE_EMAIL and FORGE_API_TOKEN repository secrets to deploy the app."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Register, deploy and install
        if: steps.creds.outputs.present == 'true'
        run: bash scripts/ci-deploy.sh

modules:
  jira:issuePanel:
    - key: claim-check-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Claim Check
      icon: resource:static;claim-check.svg
  jira:globalPage:
    - key: claim-check-setup
      resource: setup
      resolver:
        function: resolver
      render: native
      title: Claim Check setup
      icon: resource:static;claim-check.svg
  rovo:agent:
    - key: claims-assessor
      name: Claims Assessor
      description: Reviews insurance claim records in Jira against the policy wording in Confluence and quotes the relevant clauses.
      icon: resource:static;claims-assessor.svg
      prompt: resource:prompts;claims-agent.md
      conversationStarters:
        - Assess this claim against the policy wording
        - Which documents are missing for this claim?
        - Which exclusions in the policy wording mention this incident?
        - Draft a message to the customer asking for the missing documents
      actions:
        - assess-claim
        - get-policy-clauses
        - post-assessment
        - request-missing-documents
  action:
    - key: assess-claim
      name: Assess insurance claim
      function: assess-claim-fn
      actionVerb: GET
      description: >
        Checks an insurance claim (Jira issue) against its policy wording:
        verdict, facts, checks with exact clause quotes (period, deadlines,
        exclusions, limits, deductible, documents), missing documents,
        indicative payable.
      inputs:
        issueKey:
          title: Claim issue key
          type: string
          required: false
          description: The Jira issue key of the claim, for example CLM-12. Leave empty to
            use the issue the user is viewing.
    - key: get-policy-clauses
      name: Get policy clauses
      function: policy-clauses-fn
      actionVerb: GET
      description: >
        Returns the numbered clauses of the policy wording for a claim or a
        product, optionally filtered by topic. Use it to answer questions about
        what the policy says.
      inputs:
        issueKey:
          title: Claim issue key
          type: string
          required: false
          description: The Jira issue key of the claim whose policy wording to read.
        product:
          title: Product
          type: string
          required: false
          description: Product name when there is no claim, for example motor, home or
            travel.
        topic:
          title: Topic
          type: string
          required: false
          description: One of exclusions, documents, notification, limits, deductible,
            cover, waiting. Leave empty for all clauses.
    - key: post-assessment
      name: Post assessment to the claim
      function: post-assessment-fn
      actionVerb: CREATE
      description: Posts the Claim Check assessment, with clause quotes, as a comment
        on the claim issue. Only use when the user asks for it.
      inputs:
        issueKey:
          title: Claim issue key
          type: string
          required: false
          description: The Jira issue key of the claim. Leave empty to use the issue the
            user is viewing.
        note:
          title: Handler note
          type: string
          required: false
          description: An optional note from the handler to add at the end of the comment.
    - key: request-missing-documents
      name: Request missing documents
      function: request-docs-fn
      actionVerb: CREATE
      description: >
        Adds a comment to the claim listing the documents the policy requires
        that are still missing, and labels the issue docs-requested. Only use
        when the user asks for it.
      inputs:
        issueKey:
          title: Claim issue key
          type: string
          required: false
          description: The Jira issue key of the claim. Leave empty to use the issue the
            user is viewing.
        message:
          title: Message to the customer
          type: string
          required: false
          description: Optional opening text for the request, written for the customer.
  function:
    - key: resolver
      handler: index.handler
    - key: assess-claim-fn
      handler: index.assessClaimAction
    - key: policy-clauses-fn
      handler: index.policyClausesAction
    - key: post-assessment-fn
      handler: index.postAssessmentAction
    - key: request-docs-fn
      handler: index.requestDocumentsAction
resources:
  - key: panel
    path: src/frontend/panel.tsx
  - key: setup
    path: src/frontend/setup.tsx
  - key: static
    path: static
  - key: prompts
    path: prompts
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence
app:
  id: ari:cloud:ecosystem::app/ebe37522-ed75-4dc0-952b-f3f9bcf52807
  runtime:
    name: nodejs22.x
  compatibility:
    jira:
      required: true
    confluence:
      required: false
